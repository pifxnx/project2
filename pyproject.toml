[project]
name = "project2"
version = "0.1.0"
description = ""
authors = [
    {name = "Егушев",email = "kirikott11@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.143.5,<0.144.0)",
    "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "rq (>=2.12.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
